name: CI
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 20
    strategy:
      # Keep all OS/JDK combinations running so a single Windows timing
      # failure does not cancel the other matrix entries.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
